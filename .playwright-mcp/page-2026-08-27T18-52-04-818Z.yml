                - generic [ref=f33e158]: sudo apt-get update
                - generic [ref=f33e159]: sudo apt-get install neovim
            - heading "###Build from source(chad way to do)" [level=3] [ref=f33e160]
            - figure "sh Copy" [ref=f33e161]:
              - generic [ref=f33e162]:
                - generic [ref=f33e163]: sh
                - button "Copy" [ref=f33e164]
