            - paragraph [ref=f33e171]:
              - text: The default install location is
              - code [ref=f33e172]: /usr/local
            - paragraph [ref=f33e173]: "Then you can open neovim with:"
            - figure "sh Copy" [ref=f33e174]:
              - generic [ref=f33e175]:
                - generic [ref=f33e176]: sh
                - button "Copy" [ref=f33e177]
              - code [ref=f33e180]:
                - generic [ref=f33e181]: nvim
            - paragraph [ref=f33e182]: Neovim is nothing special at all if we don’t start adding a few plugins. This is the part that scares most people away when they first start using Neovim. So Let’s try break it down in easy steps.
            - paragraph [ref=f33e183]:
              - text: Close Neovim and let's add some plugins. In order to close Neovim, press
              - code [ref=f33e184]: "SHIFT + :"
              - text: to enter
              - strong [ref=f33e185]: command mode
              - text: and type
              - code [ref=f33e186]: :q
              - text: to quit.
            - heading "#Adding some flavor" [level=1] [ref=f33e187]
            - paragraph [ref=f33e188]: Let's add a clean starting point for your config that is easy and well documented if you want to customize further.
            - heading "##Clone kickstart.nvim" [level=2] [ref=f33e189]
            - paragraph [ref=f33e190]:
              - link "kickstart.nvim" [ref=f33e191]:
                - /url: https://github.com/nvim-lua/kickstart.nvim
              - text: is a minimal Neovim config and its purposeis to be a starting point(its NOT a full distro, which I dont recommend either). It comes pre-configured with LSP(if you are coming from vscode, its like the Intelissence for language related edits/search), autocompletion, fuzzy finding, and more without the bloat and weird keybinds of a full distro like LazyVim.
            - paragraph [ref=f33e192]: "Then clone the repo directly into your Neovim config folder:"
            - figure "sh Copy" [ref=f33e193]:
              - generic [ref=f33e194]:
                - generic [ref=f33e195]: sh
                - button "Copy" [ref=f33e196]
              - code [ref=f33e199]:
                - generic [ref=f33e200]: git clone https://github.com/nvim-lua/kickstart.nvim.git ~/.config/nvim
            - paragraph [ref=f33e201]: You can also fork this repo and clone from it, so if you want to backup your nvim config to use it in another machine, thats a pretty good way.
            - paragraph [ref=f33e202]: "Now open Neovim and it will automatically install all plugins on the first launch:"
            - figure "sh Copy" [ref=f33e203]:
              - generic [ref=f33e204]:
                - generic [ref=f33e205]: sh
                - button "Copy" [ref=f33e206]
              - code [ref=f33e209]:
                - generic [ref=f33e210]: nvim
            - paragraph [ref=f33e211]:
              - text: Kickstart.nvim uses the
              - code [ref=f33e212]: Lazy
              - text: plugin manager, which download and install all the plugins in the config files automatically the first time you open nvim, so just wait for the installation to finish, then restart Neovim.
            - paragraph [ref=f33e213]: "You now have a fully working setup with:"
            - list [ref=f33e214]:
              - listitem [ref=f33e215]:
                - text: "-"
                - strong [ref=f33e216]: LSP
                - text: (language server support)
              - listitem [ref=f33e217]:
                - text: "-"
                - strong [ref=f33e218]: nvim-cmp
                - text: (autocompletion)
              - listitem [ref=f33e219]:
                - text: "-"
                - strong [ref=f33e220]: Telescope
                - text: (fuzzy finder)
              - listitem [ref=f33e221]:
                - text: "-"
                - strong [ref=f33e222]: Treesitter
                - text: (better syntax highlighting)
              - listitem [ref=f33e223]:
                - text: "-"
                - strong [ref=f33e224]: Tokyonight theme
                - text: (default colorscheme)
            - paragraph [ref=f33e225]:
              - text: From here you can edit
              - code [ref=f33e226]: ~/.config/nvim/init.lua
              - text: to customize everything to your liking.
            - heading "##Setting up kickstart.nvim for web dev (JS/TS/React/Node)" [level=2] [ref=f33e227]
