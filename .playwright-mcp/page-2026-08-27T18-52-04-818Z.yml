                            - /url: https://www.youtube.com/watch?v=D4YTJ2W5q4Y
                            - generic [ref=f34e43]: Watch on
            - paragraph [ref=f33e137]: After a week I decided to learn how to use Vim motions to avoid future wrist pain from using the mouse way too much, as I wanted to spend as much time on the keyboard as possible. I also wanted to be more efficient with my tools, so I thought using Vim motions would help me tremendously(and it did, A LOT).
            - heading "#How to Install Neovim" [level=1] [ref=f33e138]
            - paragraph [ref=f33e139]: The Ubuntu package originally is a pretty old package, so in order to install a newer one you need to add the unstable apt repo.
            - heading "###Any other Linux distro other than Ubuntu, in this case Arch(btw):" [level=3] [ref=f33e140]
            - figure "sh Copy" [ref=f33e141]:
              - generic [ref=f33e142]:
