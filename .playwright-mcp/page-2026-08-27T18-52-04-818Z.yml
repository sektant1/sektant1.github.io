            - heading "###Debugging with nvim-dap" [level=3] [ref=f33e340]
            - paragraph [ref=f33e341]:
              - text: DAP stands for Debug Adapter Protocol, it's the same protocol VSCode uses under the hood. Add
              - code [ref=f33e342]: nvim-dap
              - text: "and the JS debug adapter to your plugins below the neotest one:"
            - figure "lua Copy" [ref=f33e343]:
              - generic [ref=f33e344]:
                - generic [ref=f33e345]: lua
                - button "Copy" [ref=f33e346]
              - code [ref=f33e349]:
                - generic [ref=f33e350]: "{"
                - generic [ref=f33e351]: "'mfussenegger/nvim-dap',"
                - generic [ref=f33e352]: "dependencies = {"
                - generic [ref=f33e353]: "'rcarriga/nvim-dap-ui',"
                - generic [ref=f33e354]: "'nvim-neotest/nvim-nio',"
                - generic [ref=f33e355]: "'microsoft/vscode-js-debug',"
                - generic [ref=f33e356]: "},"
                - generic [ref=f33e357]: config = function()
                - generic [ref=f33e358]: local dap = require('dap')
                - generic [ref=f33e359]: local dapui = require('dapui')
                - generic [ref=f33e360]: dapui.setup()
                - generic [ref=f33e361]: dap.listeners.after.event_initialized['dapui_config'] = dapui.open
                - generic [ref=f33e362]: dap.listeners.before.event_terminated['dapui_config'] = dapui.close
                - generic [ref=f33e363]: "dap.adapters['pwa-node'] = {"
                - generic [ref=f33e364]: type = 'server',
                - generic [ref=f33e365]: host = 'localhost',
                - generic [ref=f33e366]: "port = '${port}',"
                - generic [ref=f33e367]: "executable = {"
                - generic [ref=f33e368]: command = 'node',
                - generic [ref=f33e369]: "args = { vim.fn.stdpath('data') .. '/lazy/vscode-js-debug/dist/src/dapDebugServer.js', '${port}' },"
                - generic [ref=f33e370]: "},"
                - generic [ref=f33e371]: "}"
                - generic [ref=f33e372]: "for _, lang in ipairs({ 'javascript', 'typescript' }) do"
                - generic [ref=f33e373]: "dap.configurations[lang] = {"
                - generic [ref=f33e374]: "{"
                - generic [ref=f33e375]: type = 'pwa-node',
                - generic [ref=f33e376]: request = 'launch',
                - generic [ref=f33e377]: name = 'Launch file',
