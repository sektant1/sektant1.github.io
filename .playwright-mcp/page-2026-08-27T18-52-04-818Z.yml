            - heading "#First, Why Use Neovim as your IDE?" [level=1] [ref=f33e120]
            - paragraph [ref=f33e121]: "When you compare the out-of-the-box Neovim experience with, lets say, Vscode, your first impression would probably be:"
            - blockquote [ref=f33e122]:
              - paragraph [ref=f33e123]:
                - emphasis [ref=f33e124]: "\"How tf will I be more productive with this?\""
            - paragraph [ref=f33e125]:
              - img "vim-logo" [ref=f33e126]
            - paragraph [ref=f33e127]:
              - text: For non-users, Vim and Neovim are often perceived as an ancient, outdated and cryptic text editor. Alongside that, the steep learning curve allegedly gives the impression thats not worth the time investment, especially when other text editors are much more
              - emphasis [ref=f33e128]: straightforward
              - text: . All of this started the common claim among programmers that Vim cannot compete with modern IDEs. During this article, I'll prove to you thats a wrong take.
            - heading "##Quick Vim Background" [level=2] [ref=f33e129]
            - paragraph [ref=f33e130]: Before we deep into the Vim rabbit hole, let's make brief rundown in the Vim/Neovim history.
            - paragraph [ref=f33e131]: "Vi was created in 1976 by Bill Joy. Then, in 1991, Vim was created by Bram Moolenaar. Vim’s purpose can be found in its name: Vi IMproved. It was intended to be a better Vi. Finally, in 2014, Neovim was created. It is a fork of Vim, which makes it a “drop-in replacement that is 99% identical for basic usage”"
            - paragraph [ref=f33e132]: Between many other differences, the main one I would say its that Neovim uses Lua as the first-class language for configuration and plugin development, which is faster and easier than Vim’s traditional VimScript(and its brazilian made, lesgooo).
            - heading "#Why do I use Vim?" [level=1] [ref=f33e133]
            - paragraph [ref=f33e134]:
              - text: A bit more than a year ago, when I was researching about how can I decrease me wrist pain while typing/coding, I found the touch typing/quick typing niche, also I really hate the need to move my hand from keyboard -> mouse and vice versa. After a couple days practicing touch typing at
              - link "keybr.com" [ref=f33e135]:
                - /url: https://keybr.com
              - text: ",I've found out the PrimeAgen channel(big Vim preacher). After a few videos, he made my mind into trying Vim."
            - iframe [ref=f33e136]:
              - generic [ref=f34e1]:
                - generic "YouTube Video Player" [ref=f34e3]
                - generic [ref=f34e5]:
                  - generic:
                    - generic:
                      - generic [ref=f34e6] [cursor=pointer]
                      - button "Play video" [ref=f34e10] [cursor=pointer]
                      - button "Hide player controls" [ref=f34e12] [cursor=pointer]
                      - generic [ref=f34e14]:
                        - generic [ref=f34e19]:
                          - generic [ref=f34e20]:
                            - link "Why I use Vim in 2022" [ref=f34e21] [cursor=pointer]:
                              - /url: https://www.youtube.com/watch?v=D4YTJ2W5q4Y
                            - link "ThePrimeagen" [ref=f34e22] [cursor=pointer]:
                              - /url: /channel/UC8ENHE5xdFSwx71u3fDH5Xw
                          - generic [ref=f34e24]:
                            - button [ref=f34e25] [cursor=pointer]
                            - generic [ref=f34e27]:
                              - generic: ThePrimeagen
                              - generic: 549K subscribers
                        - generic [ref=f34e28]:
