            - heading "##Testing and debugging with Jest and DAP" [level=2] [ref=f33e300]
            - heading "###Running Jest tests with neotest" [level=3] [ref=f33e301]
            - paragraph [ref=f33e302]:
              - code [ref=f33e303]: neotest
              - text: is a plugin that integrates test runners directly into Neovim. Add it to your plugins in
              - code [ref=f33e304]: init.lua
              - text: ":"
            - figure "lua Copy" [ref=f33e305]:
              - generic [ref=f33e306]:
                - generic [ref=f33e307]: lua
                - button "Copy" [ref=f33e308]
              - code [ref=f33e311]:
                - generic [ref=f33e312]: "return = {"
                - generic [ref=f33e313]: "{"
                - generic [ref=f33e314]: "'nvim-neotest/neotest',"
                - generic [ref=f33e315]: "dependencies = {"
                - generic [ref=f33e316]: "'nvim-neotest/nvim-nio',"
                - generic [ref=f33e317]: "'nvim-lua/plenary.nvim',"
                - generic [ref=f33e318]: "'nvim-treesitter/nvim-treesitter',"
                - generic [ref=f33e319]: "'haydenmeade/neotest-jest',"
                - generic [ref=f33e320]: "},"
                - generic [ref=f33e321]: config = function()
                - generic [ref=f33e322]: "require('neotest').setup({"
                - generic [ref=f33e323]: "adapters = {"
                - generic [ref=f33e324]: "require('neotest-jest')({"
                - generic [ref=f33e325]: jestCommand = 'npx jest',
                - generic [ref=f33e326]: "}),"
                - generic [ref=f33e327]: "},"
                - generic [ref=f33e328]: "})"
                - generic [ref=f33e329]: end,
                - generic [ref=f33e330]: "},"
                - generic [ref=f33e331]: "}"
            - paragraph [ref=f33e332]: "Save and restart Neovim. Lazy will install the plugins automatically. You can now run tests with:"
