name: Release

# master only. Two artefacts come out of a push here:
#
#   1. the container image the self-hosted site runs, on GHCR
#   2. the showcase and the component registry, on GitHub Pages
#
# The installer pulls `:latest` from (1), so merging to master is the deploy.
on:
  push:
    branches: [master]
  # For re-publishing without a code change.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/hideout
          # `latest` is what the server follows; the sha tag is what you roll
          # back to when latest turns out to be wrong.
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/hideout/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # linux/amd64 only: the target is an x86 ThinkPad, and cross-building
          # a Next app under QEMU for an arm image nothing runs costs about ten
          # minutes per release.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pages:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      # A permissions block replaces the defaults wholesale, so checkout's
      # contents:read has to be spelled out alongside the Pages scopes.
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Builds the registry, the showcase and the hideout's static export, then
      # assembles them into dist-pages: hideout at the root (it carries the
      # CNAME), registry at /r, showcase at /showcase.
      - run: npm run pages:build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - id: deployment
        uses: actions/deploy-pages@v4
