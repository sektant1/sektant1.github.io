name: Staging

# `development` only. It publishes one artefact: a container image tagged
# `development`, so a staging box can run what master has not accepted yet.
#
# Pages is deliberately absent here — there is one custom domain, and it
# belongs to master. To preview the static export, read the `pages` job in CI
# or run `make pages` locally.
#
# On a server:  HIDEOUT_IMAGE=ghcr.io/sektant1/hideout:development make deploy
on:
  push:
    branches: [development]
  # For re-publishing without a code change.
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/hideout
          # Never `latest`: that tag is what the production server follows.
          tags: |
            type=raw,value=development
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/hideout/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
