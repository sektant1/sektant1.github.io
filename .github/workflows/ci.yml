name: CI

# Every branch and every pull request gets the same gate. `development` is
# where work lands day to day; `master` is what the installer pulls, so
# anything that reaches it has already been through this.
on:
  push:
    branches: [master, development]
  pull_request:
  # Release runs this same gate before it publishes anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Fails when a component exists on disk but is not registered, or the
      # other way round — the registry is generated, so drift means someone
      # edited it by hand or forgot to rebuild.
      - run: npm run registry:check
      - run: npm run test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  # Proves the image the installer will pull actually builds, before master
  # ever tries to publish it. Not pushed: this runs on branches and PRs.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/hideout/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
