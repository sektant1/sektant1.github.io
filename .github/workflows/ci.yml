name: CI

# Every branch and every pull request gets the same gate. `development` is
# where work lands day to day; `master` is what the installer pulls, so
# anything that reaches it has already been through this.
on:
  push:
    # Feature branches only. Staging and Release own the two named branches and
    # call this workflow themselves; listing them here would run the gate twice
    # on every push to them.
    branches-ignore: [master, development]
  pull_request:
  # Release and Staging run this same gate before they publish anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Fails when a component exists on disk but is not registered, or the
      # other way round — the registry is generated, so drift means someone
      # edited it by hand or forgot to rebuild.
      - run: npm run registry:check
      - run: npm run test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  # The static export is a different shape from the standalone build above —
  # CMS routes moved aside, `output: export`, no server. It breaks on its own,
  # so it gets checked before master tries to publish it. Not deployed.
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run pages:build
      # A missing CNAME silently drops the custom domain on the next deploy.
      # The model is generated rather than committed, so its absence would
      # only show up as a 404 on the boot screen of a published build.
      - run: test -f dist-pages/CNAME && test -f dist-pages/r/button.json
      - run: test -f dist-pages/models/bitcoin.glb

  # Proves the image the installer will pull actually builds, before master
  # ever tries to publish it. Not pushed: this runs on branches and PRs.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/hideout/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
