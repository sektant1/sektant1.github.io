<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="title desc">
  <title id="title">Post placeholder</title>
  <desc id="desc">Green phosphor terminal placeholder image for posts.</desc>
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 0h4v1H0z" fill="#2cff7a" opacity=".18"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#2cff7a" stop-opacity=".24"/>
      <stop offset=".55" stop-color="#0a4d22" stop-opacity=".18"/>
      <stop offset="1" stop-color="#010604"/>
    </radialGradient>
  </defs>
  <rect width="320" height="180" fill="#010604"/>
  <rect width="320" height="180" fill="url(#glow)"/>
  <rect x="14" y="14" width="292" height="152" fill="#03110a" stroke="#1fb854" stroke-width="2"/>
  <rect x="14" y="14" width="292" height="152" fill="url(#scan)"/>
  <path d="M40 48h116M40 70h210M40 92h168M40 114h226" stroke="#2cff7a" stroke-width="4" stroke-linecap="square" opacity=".78"/>
  <path d="M218 40h46v46h-46zM228 52l11 16 9-10 16 20h-36z" fill="none" stroke="#b6ffce" stroke-width="4" stroke-linejoin="miter"/>
  <text x="40" y="145" fill="#b6ffce" font-family="monospace" font-size="16" letter-spacing="2">POST BUFFER</text>
</svg>
