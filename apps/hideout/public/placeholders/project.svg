<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="title desc">
  <title id="title">Project placeholder</title>
  <desc id="desc">Green phosphor terminal placeholder image for projects.</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0v20" fill="none" stroke="#1fb854" stroke-width="1" opacity=".35"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#00cec8" stop-opacity=".2"/>
      <stop offset=".55" stop-color="#2cff7a" stop-opacity=".14"/>
      <stop offset="1" stop-color="#010604"/>
    </radialGradient>
  </defs>
  <rect width="320" height="180" fill="#010604"/>
  <rect width="320" height="180" fill="url(#glow)"/>
  <rect x="14" y="14" width="292" height="152" fill="#03110a" stroke="#1fb854" stroke-width="2"/>
  <rect x="14" y="14" width="292" height="152" fill="url(#grid)"/>
  <path d="M66 98h60l24-48 44 88 24-40h36" fill="none" stroke="#2cff7a" stroke-width="5" stroke-linejoin="miter"/>
  <path d="M54 42h44M54 62h72M54 82h36" stroke="#b6ffce" stroke-width="4" opacity=".82"/>
  <circle cx="194" cy="98" r="8" fill="#b6ffce"/>
  <text x="54" y="145" fill="#b6ffce" font-family="monospace" font-size="16" letter-spacing="2">PROJECT NODE</text>
</svg>
